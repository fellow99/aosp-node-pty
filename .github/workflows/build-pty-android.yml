name: Build node-pty for Android

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      node_version:
        description: "Paired Node.js / runtime version (e.g. 24.22.1)"
        required: true
        default: "24.22.1"
        type: string
      node_pty_version:
        description: "Upstream node-pty npm version (source unmodified)"
        required: true
        default: "1.1.0"
        type: string
      android_api:
        description: "Android API level"
        required: true
        default: "24"
        type: string
      prerelease:
        description: "Publish the GitHub Release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-arm64-v8a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: 28.2.13676358
      RUNTIME_REPO: fellow99/aosp-node-runtime
    steps:
      - uses: actions/checkout@v4

      # 从 tag 名（push tag）或 dispatch 输入解析版本，并导出到 job 环境供后续 step 使用。
      # 不能在 job 级 env 里引用 steps.*.outputs（该表达式在 step 存在前求值会致工作流加载失败）。
      - name: Resolve version from tag or dispatch inputs
        id: ver
        env:
          INPUT_NODE: ${{ inputs.node_version }}
          INPUT_PTY: ${{ inputs.node_pty_version }}
          INPUT_API: ${{ inputs.android_api }}
          INPUT_PRE: ${{ inputs.prerelease }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "$REF" == v* ]]; then
            node="${REF#v}"
            pty="1.1.0"; api="24"; pre=false
            [[ "$node" == *-* ]] && pre=true
          else
            node="${INPUT_NODE:-24.22.1}"
            pty="${INPUT_PTY:-1.1.0}"
            api="${INPUT_API:-24}"
            pre="${INPUT_PRE:-false}"
          fi
          echo "node=$node"; echo "pty=$pty"; echo "api=$api"; echo "pre=$pre"
          echo "NODE_VERSION=$node"  >> "$GITHUB_ENV"
          echo "NODE_PTY_VERSION=$pty" >> "$GITHUB_ENV"
          echo "ANDROID_API=$api"    >> "$GITHUB_ENV"
          echo "PRE=$pre"           >> "$GITHUB_ENV"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file tar xz-utils binutils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Android NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Fetch paired libnode.so from aosp-node-runtime release (link-time only)
        run: |
          set -euo pipefail
          tag="v${NODE_VERSION}"
          base="https://github.com/${RUNTIME_REPO}/releases/download/${tag}"
          archive="node-v${NODE_VERSION}-android-arm64-v8a.tar.gz"
          echo "下载配对运行时资产（公开 Release，匿名 curl）：${RUNTIME_REPO} ${tag} ${archive}"
          # aosp-node-runtime 为 public：直接走 browser_download_url，无需跨仓 token。
          # 取不到（含 404）即失败：绝不允许 against 错误引擎版本编出 pty。
          curl -fsSL --retry 3 -o "$archive" "$base/$archive"
          curl -fsSL --retry 3 -o "$archive.sha256" "$base/$archive.sha256"
          echo "--- runtime 资产 sha256 校验 ---"
          # runtime 的 .sha256 文件名字段可能带 GNU binary 标记 '*' 且紧贴名，
          # 不能直接 sha256sum -c（会把 '*' 当文件名一部分）；取 hash 自行比对。
          want="$(awk '{print $1}' "$archive.sha256")"
          got="$(sha256sum "$archive" | awk '{print $1}')"
          echo "want=$want"
          echo "got =$got"
          test "$want" = "$got"
          mkdir -p .dist/libnode
          tar -xzf "$archive" -C .dist/libnode
          LIBNODE="$(find .dist/libnode -name libnode.so -path '*arm64-v8a*' | head -1)"
          test -n "$LIBNODE" -a -f "$LIBNODE"
          # 必须是 AArch64 共享库且带 SONAME libnode.so。
          file "$LIBNODE"
          readelf -h "$LIBNODE" | grep -E "Machine:.*AArch64"
          readelf -d "$LIBNODE" | grep -E "SONAME.*libnode\.so"
          echo "LIBNODE=$LIBNODE" >> "$GITHUB_ENV"

      - name: Fetch node-pty source + Node headers
        run: |
          node scripts/fetch-node-pty-source.mjs \
            --node "$NODE_VERSION" \
            --node-pty "$NODE_PTY_VERSION" \
            --out .dist/src
          cat .dist/src/FETCH-METADATA.json

      - name: Cross-compile libpty_node.so
        run: |
          chmod +x scripts/build-pty-android.sh
          bash scripts/build-pty-android.sh \
            --node "$NODE_VERSION" \
            --api "$ANDROID_API" \
            --src .dist/src/node-pty \
            --addon .dist/src/node-addon-api \
            --headers .dist/src/node-headers/include/node \
            --libnode "$LIBNODE" \
            --ndk "$ANDROID_HOME/ndk/${NDK_VERSION}" \
            --out build/out

      - name: Verify build output
        run: |
          PTY=build/out/libpty_node.so
          file "$PTY"
          readelf -h "$PTY" | grep -E "Type:|Machine:"
          # 本工程硬门禁：DT_NEEDED 必须含 libnode.so
          readelf -d "$PTY" | grep -E "NEEDED"
          readelf -d "$PTY" | grep -E "NEEDED.*libnode\.so"
          # napi_* 必须是未定义引用（由已加载引擎运行期解析）
          echo "--- undefined napi_* (sample) ---"
          nm -D "$PTY" | grep ' U ' | grep -E 'napi_|node_' | head -10
          nm -D "$PTY" | grep ' U ' | grep -q 'napi_'
          # 16 KB 页对齐
          if readelf -lW "$PTY" | awk '/LOAD/{print strtonum($NF)}' | grep -Evx '16384'; then
            echo "ERROR: a LOAD segment is not 16 KB aligned" >&2; exit 1
          fi
          # 绝不能把引擎/C++ 运行时打进本件
          test ! -e build/out/libnode.so
          echo "--- BUILD-METADATA.txt ---"; cat build/out/BUILD-METADATA.txt

      - name: Run provision gates
        run: |
          node tools/provision.mjs --inspect build/out/libpty_node.so \
            --node "$NODE_VERSION" --abi arm64-v8a

      - name: Package output
        run: |
          archive="node-pty-v${NODE_VERSION}-android-arm64-v8a.tar.gz"
          cp .dist/src/FETCH-METADATA.json build/out/
          tar -C build/out -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-pty-${{ env.NODE_VERSION }}-android-arm64-v8a
          path: |
            node-pty-v${{ env.NODE_VERSION }}-android-arm64-v8a.tar.gz
            node-pty-v${{ env.NODE_VERSION }}-android-arm64-v8a.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="node-pty-v${NODE_VERSION}-android-arm64-v8a.tar.gz"
          notes="Cross-compiled, stripped node-pty native addon (libpty_node.so) for Android arm64-v8a (API ${ANDROID_API}). Paired version-for-version with aosp-node-runtime v${NODE_VERSION} (NODE_MODULE_VERSION must match). DT_NEEDED libnode.so; the engine is link-time only and is NOT bundled — provide io.github.fellow99:node-runtime:${NODE_VERSION} at runtime. Upstream node-pty ${NODE_PTY_VERSION} source unmodified; built with NDK ${NDK_VERSION}."
          preflag=(); [ "$PRE" = "true" ] && preflag=(--prerelease)
          if gh release view "v${NODE_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${NODE_VERSION}" "$archive" "$archive.sha256" --clobber
            if [ "$PRE" = "true" ]; then
              gh release edit "v${NODE_VERSION}" --target "$GITHUB_SHA" --prerelease
            else
              gh release edit "v${NODE_VERSION}" --target "$GITHUB_SHA" --prerelease=false
            fi
          else
            gh release create "v${NODE_VERSION}" \
              "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" \
              --title "node-pty for Node.js v${NODE_VERSION} (Android arm64-v8a)" \
              --notes "$notes" \
              "${preflag[@]}"
          fi
