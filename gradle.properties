# ── 公共元数据（可提交）──────────────────────────────────────────────────────
GROUP=io.github.fellow99
VERSION_NAME=0.1.0
# pty 制品版本 = 配对 Node 版本 = Maven 坐标 version（恒等，见 docs/000-工程规划.md §2.1）。
# 注意：不能用 NODE_* 前缀——Gradle 9.4 把所有 NODE_ 前缀属性保留给内置 Node 工具链，
# -P 覆盖会被忽略；故用 PTY_VERSION（与 node-runtime 的 RUNTIME_VERSION 同纪律）。
# 多版本发布：-PPTY_VERSION=<node 版本>（见 pty.lock.json 的 releases）。
PTY_VERSION=24.22.1
POM_NAME=node-pty
POM_DESCRIPTION=node-pty native addon (libpty_node.so) for Android arm64-v8a, paired version-for-version with aosp-node-runtime - cross-compiled N-API pseudoterminal shared library
POM_URL=https://github.com/fellow99/aosp-node-pty
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://opensource.org/licenses/MIT
POM_SCM_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-pty.git
POM_SCM_DEVELOPMENT_CONNECTION=scm:git:git://github.com/fellow99/aosp-node-pty.git
POM_DEVELOPER_ID=fellow99
POM_DEVELOPER_NAME=fellow99

# 发布门禁（默认关；真实发布时 RELEASE=true + 用户级 gradle.properties 提供 Token/GPG）
RELEASE=false
